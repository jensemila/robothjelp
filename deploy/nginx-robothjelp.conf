# Nginx-config for robothjelp.no. Ligger på serveren som
# /etc/nginx/sites-enabled/robothjelp. Certbot-linjer er beholdt.
#
# PERSONVERNKRAV: IP skal aldri til disk. Derfor står «access_log off» i
# BEGGE serverblokkene, også port 80. En innledende HTTP-forespørsel treffer
# port 80 før den omdirigeres til HTTPS, og uten «access_log off» der ville
# IP-en blitt logget før omdirigeringen.

server {
    server_name robothjelp.no www.robothjelp.no;

    access_log off;

    # Sikkerhets- og personvernheadere.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP videresendes til appen, som kun bruker den flyktig til rate
        # limiting i minnet, aldri til disk.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/robothjelp.no/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/robothjelp.no/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name robothjelp.no www.robothjelp.no;

    # Uten denne logges IP-en på den innledende HTTP-forespørselen.
    access_log off;

    return 301 https://$host$request_uri;
}
